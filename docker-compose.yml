# ===================================
# Docker Compose - Django + PostgreSQL + Redis + Celery
# ===================================

services:
  # Service PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: alsaba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsaba_db}
      POSTGRES_USER: ${POSTGRES_USER:-alsaba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alsaba_password}
    ports:
      - "5432:5432" # À retirer en production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alsaba_user} -d ${POSTGRES_DB:-alsaba_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alsaba_network

  # Service Redis (Message Broker & Cache)
  redis:
    image: redis:7.2-alpine
    container_name: alsaba_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alsaba_network

  # Service Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_django
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?err}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?err}
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:?err}
      - DATABASE_USER=${POSTGRES_USER:?err}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?err}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - RUN_MIGRATIONS=True
      # Redis Config
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Sécurité API
      - DIDIT_API_KEY=${DIDIT_API_KEY:-dp_live_placeholder}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-fw_live_placeholder}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY:-fw_pub_placeholder}
      - FLUTTERWAVE_ENCRYPTION_KEY=${FLUTTERWAVE_ENCRYPTION_KEY:-fw_enc_placeholder}
      - FLUTTERWAVE_WEBHOOK_SECRET=${FLUTTERWAVE_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./Project:/app # Montage du code pour dev (hot reload)
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alsaba_network

  # Celery Worker (Traitement des tâches)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_celery_worker
    restart: unless-stopped
    environment:
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:-alsaba_db}
      - DATABASE_USER=${POSTGRES_USER:-alsaba_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-alsaba_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # Commande pour lancer le worker
    command: celery -A Project worker -l info
    volumes:
      - ./Project:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
      - web
    networks:
      - alsaba_network

  # Celery Beat (Planificateur)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_celery_beat
    restart: unless-stopped
    environment:
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:-alsaba_db}
      - DATABASE_USER=${POSTGRES_USER:-alsaba_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-alsaba_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # Commande pour lancer le scheduler
    command: celery -A Project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./Project:/app
    depends_on:
      - db
      - redis
      - web
    networks:
      - alsaba_network

  # Service pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alsaba_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@alsaba.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alsaba_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  pgadmin_data:


networks:
  alsaba_network:
    driver: bridge

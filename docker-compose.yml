# ===================================
# Docker Compose - Django + PostgreSQL + Redis + Celery
# ===================================

services:
  # Service PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: alsaba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alsaba_db}
      POSTGRES_USER: ${POSTGRES_USER:-alsaba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alsaba_password}
    ports:
      - "5432:5432" # À retirer en production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alsaba_user} -d ${POSTGRES_DB:-alsaba_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alsaba_network

  # Service Redis (Message Broker & Cache)
  redis:
    image: redis:7.2-alpine
    container_name: alsaba_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alsaba_network

  # Service Django Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_django
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?err}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?err}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:?err}
      - DATABASE_USER=${POSTGRES_USER:?err}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?err}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - RUN_MIGRATIONS=True
      # Redis Config
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/0
      # Sécurité API
      - DIDIT_API_KEY=${DIDIT_API_KEY:-dp_live_placeholder}
      - DIDIT_WEBHOOK_SECRET=${DIDIT_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY:-fw_live_placeholder}
      - FLUTTERWAVE_PUBLIC_KEY=${FLUTTERWAVE_PUBLIC_KEY:-fw_pub_placeholder}
      - FLUTTERWAVE_ENCRYPTION_KEY=${FLUTTERWAVE_ENCRYPTION_KEY:-fw_enc_placeholder}
      - FLUTTERWAVE_WEBHOOK_SECRET=${FLUTTERWAVE_WEBHOOK_SECRET:-webhook_secret_placeholder}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/1}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_FORCED=${SENTRY_FORCED:-False}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-alsaba@1.0.0}
      # Email SMTP : la tache d'envoi tourne dans le worker, les deux services
      # en ont besoin. Sans ces variables, les confirmations de depot/retrait
      # ne partent pas (le .env de la racine n'est pas monte dans le conteneur).
      - KYC_ENCRYPTION_KEY=${KYC_ENCRYPTION_KEY:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@alsaba.com}
      # Taux de change : sans cette cle, le service retombe en silence sur des
      # taux fixes codes en dur (Wallet/Services/exchange_rate_service.py).
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY:-}
      # Firebase : chemin DANS le conteneur (le volume monte ./Project sur /app).
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/firebase-credentials.json}
      # Flutterwave : sans FLUTTERWAVE_ENVIRONMENT, on reste en sandbox et aucun
      # paiement reel n'aboutit.
      - FLUTTERWAVE_ENVIRONMENT=${FLUTTERWAVE_ENVIRONMENT:-sandbox}
      - FLUTTERWAVE_REDIRECT_URL=${FLUTTERWAVE_REDIRECT_URL:-}
      - FLUTTERWAVE_TIMEOUT=${FLUTTERWAVE_TIMEOUT:-30}
      - FLUTTERWAVE_MAX_RETRIES=${FLUTTERWAVE_MAX_RETRIES:-3}
      - FLUTTERWAVE_RETRY_DELAY=${FLUTTERWAVE_RETRY_DELAY:-2}
    # Dev uniquement : rechargement a chaud. L'image utilise daphne par defaut
    # (voir Dockerfile) pour la production.
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    healthcheck:
      # Liveness uniquement : /ready/ ferait redemarrer web quand c'est Postgres
      # qui est en vrac, ce qui n'arrange rien.
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=5).status==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ./Project:/app # Montage du code pour dev (hot reload)
      # Credentials Firebase en lecture seule : exclus de l'image (.dockerignore)
      # pour ne pas cuire la cle de compte de service dans les layers.
      - ./Project/firebase-credentials.json:/app/firebase-credentials.json:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alsaba_network

  # Celery Worker (Traitement des tâches)
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_celery_worker
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?err}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?err}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:-alsaba_db}
      - DATABASE_USER=${POSTGRES_USER:-alsaba_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-alsaba_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/0
      # Sentry Config
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_FORCED=${SENTRY_FORCED:-False}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-alsaba@1.0.0}
      # Email SMTP : la tache d'envoi tourne dans le worker, les deux services
      # en ont besoin. Sans ces variables, les confirmations de depot/retrait
      # ne partent pas (le .env de la racine n'est pas monte dans le conteneur).
      - KYC_ENCRYPTION_KEY=${KYC_ENCRYPTION_KEY:-}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-False}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@alsaba.com}
      # Taux de change : sans cette cle, le service retombe en silence sur des
      # taux fixes codes en dur (Wallet/Services/exchange_rate_service.py).
      - EXCHANGERATE_API_KEY=${EXCHANGERATE_API_KEY:-}
      # Firebase : chemin DANS le conteneur (le volume monte ./Project sur /app).
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/firebase-credentials.json}
      # Flutterwave : sans FLUTTERWAVE_ENVIRONMENT, on reste en sandbox et aucun
      # paiement reel n'aboutit.
      - FLUTTERWAVE_ENVIRONMENT=${FLUTTERWAVE_ENVIRONMENT:-sandbox}
      - FLUTTERWAVE_REDIRECT_URL=${FLUTTERWAVE_REDIRECT_URL:-}
      - FLUTTERWAVE_TIMEOUT=${FLUTTERWAVE_TIMEOUT:-30}
      - FLUTTERWAVE_MAX_RETRIES=${FLUTTERWAVE_MAX_RETRIES:-3}
      - FLUTTERWAVE_RETRY_DELAY=${FLUTTERWAVE_RETRY_DELAY:-2}
    # Commande pour lancer le worker
    command: celery -A Project worker -l info
    volumes:
      - ./Project:/app
      - ./Project/firebase-credentials.json:/app/firebase-credentials.json:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
      - web
    networks:
      - alsaba_network

  # Celery Beat (Planificateur)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alsaba_celery_beat
    restart: unless-stopped
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:?err}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?err}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - DATABASE_ENGINE=django.db.backends.postgresql
      - DATABASE_NAME=${POSTGRES_DB:-alsaba_db}
      - DATABASE_USER=${POSTGRES_USER:-alsaba_user}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-alsaba_password}
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - REDIS_BROKER_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/0
      # Sentry Config
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_FORCED=${SENTRY_FORCED:-False}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-alsaba@1.0.0}
      # Cadence des taches planifiees (liberation d'escrow, reconciliation).
      - OFFER_CHECK_INTERVAL=${OFFER_CHECK_INTERVAL:-600}
      - TRANSACTION_RECONCILE_INTERVAL=${TRANSACTION_RECONCILE_INTERVAL:-1800}
    # Commande pour lancer le scheduler
    command: celery -A Project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./Project:/app
    depends_on:
      - db
      - redis
      - web
    networks:
      - alsaba_network

  # Flower : monitoring des workers, files et taches Celery
  flower:
    image: mher/flower:2.0
    container_name: alsaba_flower
    restart: unless-stopped
    # Outil de dev : ne demarre qu'avec --profile tools
    profiles: ["tools"]
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Auth basique obligatoire : sans elle, l'UI expose les arguments des
      # taches (montants, identifiants de transaction) a qui atteint le port.
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?err}
      - FLOWER_PURGE_OFFLINE_WORKERS=300
    ports:
      # Bind localhost uniquement : a exposer via le reverse-proxy si besoin.
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - alsaba_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O- --spider http://localhost:5555/healthcheck || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: alsaba_pgadmin
    restart: unless-stopped
    # Outil de dev : ne demarre qu'avec --profile tools
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@alsaba.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alsaba_network

  # Service ngrok for webhook testing
  ngrok:
    image: ngrok/ngrok:latest
    container_name: alsaba_ngrok
    restart: unless-stopped
    # Outil de dev : ne demarre qu'avec --profile tools
    profiles: ["tools"]
    command: "http web:8000 --log stdout"
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTH_TOKEN}
    depends_on:
      - web
    networks:
      - alsaba_network

  # Service de backup PostgreSQL automatisé
  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile.backup
    container_name: alsaba_backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=30
      - SENTRY_DSN=${SENTRY_DSN}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    volumes:
      - backup_data:/backups
      # Scripts fournis par l'image (fins de ligne normalisees LF).
      # Ne pas monter ./docker/backup:/scripts : un checkout Windows (CRLF)
      # casserait l'execution des scripts bash dans le conteneur.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - alsaba_network
    healthcheck:
      test: [ "CMD", "test", "-f", "/backups/last_backup.json" ]
      interval: 1h
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  pgadmin_data:
  backup_data:


networks:
  alsaba_network:
    driver: bridge

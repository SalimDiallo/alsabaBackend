    WithdrawalError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
        available_balance:
          type: number
          format: double
        required_amount:
          type: number
          format: double
      required:
      - error
      - success
    WithdrawalPaymentMethodEnum:
      enum:
      - card
      - orange_money
      type: string
      description: |-
        * `card` - Compte bancaire
        * `orange_money` - Orange Money
    WithdrawalRequest:
      type: object
      description: |-
        Sérialiseur pour l'initiation d'un retrait
        Accepte soit un payment_method_id (méthode sauvegardée) soit les détails complets
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Montant du retrait dans la devise du portefeuille
        payment_method:
          allOf:
          - $ref: '#/components/schemas/WithdrawalPaymentMethodEnum'
          description: |-
            Méthode de retrait

            * `card` - Compte bancaire
            * `orange_money` - Orange Money
        payment_method_id:
          type: string
          format: uuid
          description: ID d'une méthode de paiement sauvegardée (alternative aux détails
            ci-dessous)
        account_number:
          type: string
          minLength: 1
          description: Numéro de compte bancaire (requis si pas de payment_method_id)
          maxLength: 50
        bank_code:
          type: string
          minLength: 1
          description: Code de la banque (requis si pas de payment_method_id)
          maxLength: 20
        account_name:
          type: string
          minLength: 1
          description: Nom du titulaire du compte (requis si pas de payment_method_id)
          maxLength: 200
        bank_country:
          type: string
          minLength: 1
          description: 'Code pays de la banque (ex: FR, SN, CI) - optionnel'
          maxLength: 2
        bank_name:
          type: string
          minLength: 1
          description: Nom de la banque (optionnel)
          maxLength: 200
        orange_money_number:
          type: string
          minLength: 1
          description: Numéro Orange Money (requis si pas de payment_method_id)
          maxLength: 20
        save_payment_method:
          type: boolean
          default: false
          description: Sauvegarder cette méthode de paiement pour usage futur
        payment_method_label:
          type: string
          minLength: 1
          description: Nom à donner à la méthode sauvegardée (si save_payment_method=True)
          maxLength: 100
      required:
      - amount
      - payment_method
    WithdrawalResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        transaction:
          $ref: '#/components/schemas/Transaction'
        reference:
          type: string
        amount:
          type: number
          format: double
        fee:
          type: number
          format: double
        total_deducted:
          type: number
          format: double
        currency:
          type: string
        currency_info: {}
      required:
      - amount
      - currency
      - currency_info
      - fee
      - message
      - reference
      - success
      - total_deducted
      - transaction
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Authentification
  description: Endpoints de connexion et inscription (JWT)
- name: Profil & KYC
  description: Gestion du profil utilisateur et vérification d'identité
- name: Portefeuille
  description: Opérations financières et historique des transactions
- name: Offres P2P
  description: Cycle de vie des offres de swap et Escrow
- name: Suggestions
  description: Flux de recommandations personnalisé
- name: Notifications
  description: Gestion des alertes utilisateur

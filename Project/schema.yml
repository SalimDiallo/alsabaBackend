openapi: 3.0.3
info:
  title: Alsaba P2P API
  version: 1.0.0
  description: |-
    API sécurisée pour l'échange P2P et le portefeuille financier Alsaba.

    Cette API gère l'authentification, le KYC (Didit), les transactions financières (Dépôts/Retraits via Flutterwave) et le flux Escrow sécurisé pour le swap de devises.
paths:
  /api/accounts/auth/phone/:
    post:
      operationId: accounts_auth_phone_create
      description: Envoie un code OTP par SMS au numéro fourni. Crée ou récupère l'utilisateur
        associé.
      summary: Initier l'authentification par téléphone
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneAuthRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneAuthError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Trop de tentatives
          description: ''
  /api/accounts/auth/refresh/:
    post:
      operationId: accounts_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/auth/resend/:
    post:
      operationId: accounts_auth_resend_create
      description: Envoie un nouveau code OTP si le précédent n'a pas été reçu.
      summary: Renvoyer le code OTP
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendOTPError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Trop de demandes de renvoi
          description: ''
  /api/accounts/auth/status/:
    get:
      operationId: accounts_auth_status_retrieve
      description: Vérifie si une session d'authentification est toujours valide.
      summary: Vérifier le statut de la session
      parameters:
      - in: query
        name: session_key
        schema:
          type: string
        description: Clé de session
        required: true
      tags:
      - Authentification
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'
          description: ''
  /api/accounts/auth/verify/:
    post:
      operationId: accounts_auth_verify_create
      description: Vérifie le code OTP envoyé par SMS. Si valide, retourne les tokens
        JWT.
      summary: Vérifier le code OTP
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOTPError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Numéro frauduleux ou jetable
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Utilisateur non trouvé
          description: ''
  /api/accounts/delete/:
    post:
      operationId: accounts_delete_create
      description: Initie le processus de supression. Envoie un OTP de confirmation.
      summary: Demander la suppression du compte
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeleteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteRequestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteRequestError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Trop de tentatives
          description: ''
  /api/accounts/delete/confirm/:
    post:
      operationId: accounts_delete_confirm_create
      description: Valide l'OTP et effectue la suppression logicielle (soft delete)
        du compte.
      summary: Confirmer la suppression du compte
      tags:
      - Authentification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeleteConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountDeleteConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountDeleteConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteConfirmResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteConfirmError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Utilisateur non autorisé
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Trop de tentatives échouées
          description: ''
  /api/accounts/kyc/verify/:
    post:
      operationId: accounts_kyc_verify_create
      description: Envoie un document d'identité (image base64 ou URL) pour vérification
        par Didit.
      summary: Soumettre un document KYC
      tags:
      - Profil & KYC
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KYCVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/KYCVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/KYCVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCApprovalResponse'
          description: ''
        '202':
          content:
            application/json:
              schema:
                description: Document reçu, en attente de vérification manuelle
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCRejectionResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Numéro de téléphone non vérifié
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Trop de tentatives
          description: ''
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCTechnicalError'
          description: ''
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      description: Retourne les informations détaillées du profil, y compris le statut
        de vérification et le pourcentage de complétion.
      summary: Récupérer le profil utilisateur
      tags:
      - Profil & KYC
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: ''
    patch:
      operationId: accounts_profile_partial_update
      description: Permet de mettre à jour partiellement les informations du profil
        (email, nom, etc.).
      summary: Mettre à jour le profil
      tags:
      - Profil & KYC
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpdateResponse'
          description: ''
  /api/accounts/webhooks/didit/kyc/:
    post:
      operationId: accounts_webhooks_didit_kyc_create
      description: Reçoit les callbacks de statut de vérification KYC.
      summary: Webhook Didit KYC
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Webhook traité avec succès
          description: ''
  /api/notifications/:
    get:
      operationId: notifications_list
      description: |-
        Liste les notifications de l'utilisateur connecté.
        Permet de marquer comme lu.
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
          description: ''
  /api/notifications/{id}/read/:
    post:
      operationId: notifications_read_create
      description: Marque une notification spécifique comme lue.
      summary: Marquer une notification comme lue
      parameters:
      - in: path
        name: id
        schema:
          type: string
        description: ID de la notification
        required: true
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadResponse'
          description: ''
  /api/notifications/read_all/:
    post:
      operationId: notifications_read_all_create
      description: Marque toutes les notifications de l'utilisateur comme lues.
      summary: Tout marquer comme lu
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllResponse'
          description: ''
  /api/notifications/register-device/:
    post:
      operationId: notifications_register_device_create
      description: Enregistre un token FCM pour recevoir les notifications push.
      summary: Enregistrer un appareil (FCM)
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
  /api/offers/:
    get:
      operationId: offers_list
      description: |-
        GET /api/offers/
        Liste les offres visibles (OPEN ou les miennes).
      tags:
      - offers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/{id}/:
    get:
      operationId: offers_retrieve
      description: Récupère les informations complètes d'une offre spécifique.
      summary: Détail d'une offre P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Offre introuvable
          description: ''
  /api/offers/{id}/accept/:
    post:
      operationId: offers_accept_create
      description: Permet à un second utilisateur d'accepter une offre ouverte. L'accepteur
        doit fournir les détails de son bénéficiaire (celui qui recevra les fonds).
      summary: Accepter une offre P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptOfferRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Offre non disponible ou déjà acceptée
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: L'auteur ne peut pas accepter sa propre offre
          description: ''
  /api/offers/{id}/beneficiary-confirm/:
    post:
      operationId: offers_beneficiary_confirm_create
      description: Permet à l'un des bénéficiaires impliqués dans le swap de confirmer
        manuellement la réception des fonds hors-plateforme si nécessaire.
      summary: Confirmation bénéficiaire P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
  /api/offers/{id}/cancel/:
    post:
      operationId: offers_cancel_create
      description: Annule une offre existante. Si l'offre était en cours de traitement,
        les fonds en escrow sont restitués.
      summary: Annuler une offre P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Annulation impossible à ce stade
          description: ''
  /api/offers/{id}/confirm/:
    post:
      operationId: offers_confirm_create
      description: Valide et exécute techniquement le swap (transfert des fonds entre
        les wallets et libération de l'escrow) une fois toutes les conditions réunies.
      summary: Confirmer la transaction P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Conditions de swap non remplies
          description: ''
  /api/offers/{id}/dispute/:
    post:
      operationId: offers_dispute_create
      description: Ouvre un litige formel sur une offre en cours de transaction. Bloque
        l'exécution jusqu'à résolution par un admin.
      summary: Ouvrir un litige
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisputeOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisputeOfferRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Litige impossible
          description: ''
  /api/offers/{id}/update/:
    put:
      operationId: offers_update_update
      description: Permet de modifier une offre existante si elle est encore ouverte
        (OPEN) et appartient à l'utilisateur.
      summary: Modifier une offre P2P
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateOfferRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '403':
          content:
            application/json:
              schema:
                description: Non autorisé
          description: ''
  /api/offers/{id}/validate/:
    post:
      operationId: offers_validate_create
      description: Le créateur de l'offre (Vendeur) valide l'acceptation et fournit
        les détails du bénéficiaire qui recevra les fondus de l'accepteur.
      summary: Valider une offre (Vendeur)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ValidateOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ValidateOfferRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Action non autorisée à ce stade
          description: ''
  /api/offers/{offer_id}/disputes/:
    post:
      operationId: offers_disputes_create
      description: Crée un nouveau litige associé à un offre spécifique. Bloque le
        swap si celui-ci n'a pas été confirmé.
      summary: Initier un litige
      parameters:
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateDisputeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiateDisputeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiateDisputeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Litige déjà existant ou offre terminée
          description: ''
  /api/offers/create/:
    post:
      operationId: offers_create_create
      description: Crée une nouvelle offre de swap de devises. L'utilisateur doit
        avoir un solde suffisant dans la devise de vente.
      summary: Créer une offre P2P
      tags:
      - Offres P2P
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateOfferRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Solde insuffisant ou données invalides
          description: ''
        '429':
          content:
            application/json:
              schema:
                description: Limite de création atteinte
          description: ''
  /api/offers/disputes/:
    get:
      operationId: offers_disputes_list
      description: Liste tous les litiges accessibles à l'utilisateur connecté (ses
        propres litiges ou tous pour les admins).
      summary: Lister les litiges
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dispute'
          description: ''
  /api/offers/disputes/{dispute_id}/:
    get:
      operationId: offers_disputes_retrieve
      description: Récupère les détails d'un litige spécifique (raisons, preuves,
        statut).
      summary: Détail d'un litige
      parameters:
      - in: path
        name: dispute_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Offres P2P
      security:
      - jwtAuth: []
      responses:

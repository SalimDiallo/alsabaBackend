components:
  schemas:
    AcceptOfferRequest:
      type: object
      properties:
        offer_id:
          type: string
          format: uuid
        beneficiary_name:
          type: string
          minLength: 1
        beneficiary_phone:
          type: string
          minLength: 1
      required:
      - offer_id
    AccountDeleteConfirmError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        remaining_attempts:
          type: integer
      required:
      - code
      - error
    AccountDeleteConfirmRequest:
      type: object
      description: Confirmation avec OTP
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
        session_key:
          type: string
          minLength: 1
      required:
      - code
      - session_key
    AccountDeleteConfirmResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        action:
          type: string
        metadata: {}
      required:
      - action
      - message
      - metadata
      - success
    AccountDeleteRequest:
      type: object
      description: Demande de suppression
      properties:
        reason:
          type: string
          maxLength: 100
    AccountDeleteRequestError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
      - code
      - error
    AccountDeleteRequestResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        session_key:
          type: string
        expires_in:
          type: integer
        next_step:
          type: string
        warning:
          type: string
      required:
      - expires_in
      - message
      - next_step
      - session_key
      - success
    ActionEnum:
      enum:
      - login
      - register
      type: string
      description: |-
        * `login` - login
        * `register` - register
    AuthStatusResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        session: {}
        user: {}
        next_steps:
          type: array
          items:
            type: string
        metadata: {}
      required:
      - authenticated
      - next_steps
      - session
      - user
    CancelDepositError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
      - code
      - error
      - success
    CancelDepositResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        transaction:
          $ref: '#/components/schemas/Transaction'
        refund_amount:
          type: number
          format: double
      required:
      - message
      - refund_amount
      - success
      - transaction
    ConfirmDepositError:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
      - code
      - error
      - success
    ConfirmDepositResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        transaction:
          $ref: '#/components/schemas/Transaction'
        wallet_balance:
          type: number
          format: double
        amount_credited:
          type: number
          format: double
      required:
      - amount_credited
      - message
      - success
      - transaction
      - wallet_balance
    CreateCardPaymentMethodRequest:
      type: object
      description: Sérialiseur pour créer une méthode de paiement carte
      properties:
        label:
          type: string
          minLength: 1
          description: 'Nom donné à cette carte (ex: ''Ma carte principale'')'
          maxLength: 100
        card_number:
          type: string
          minLength: 1
          description: Numéro de carte complet
          maxLength: 19
        card_expiry_month:
          type: integer
          maximum: 12
          minimum: 1
          description: Mois d'expiration (1-12)
        card_expiry_year:
          type: integer
          maximum: 2035
          minimum: 2024
          description: Année d'expiration
        card_cvv:
          type: string
          minLength: 1
          description: CVV de la carte (requis pour la sauvegarde mais ne sera pas
            stocké)
          maxLength: 4
        is_default:
          type: boolean
          default: false
          description: Définir comme méthode par défaut pour les dépôts par carte
      required:
      - card_cvv
      - card_expiry_month
      - card_expiry_year
      - card_number
      - label
    CreateOfferRequest:
      type: object
      properties:
        amount_sell:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency_sell:
          type: string
          minLength: 1
          maxLength: 3
        amount_buy:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency_buy:
          type: string
          minLength: 1
          maxLength: 3
        expiry_hours:
          type: integer
          maximum: 72
          minimum: 1
          default: 24
        beneficiary_name:
          type: string
          minLength: 1

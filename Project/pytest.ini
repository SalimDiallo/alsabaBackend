[pytest]
DJANGO_SETTINGS_MODULE = Project.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider -ra
# Limite la collecte aux applications : sans ca, pytest ratisse staticfiles/,
# media/ et .venv/ a chaque run.
testpaths = Accounts Wallet Offer Suggestions Notifications Project

[coverage:run]
source = Accounts,Wallet,Offer,Suggestions,Notifications,Project
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */admin.py
    */apps.py
    Project/settings.py
    Project/wsgi.py
    Project/asgi.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
